<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Interactive 3D plan of Room 202 with draggable furniture and layout options.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Room 202">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9B%8F%3C/text%3E%3C/svg%3E">
<title>Room 202</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root{
    --ground:#E6E7DE; --panel:#F4F4EE; --sunk:#DBDED1;
    --ink:#1B1E15; --ink-2:#4A4F3E; --ink-3:#72775F;
    --rule:#C6CAB8; --gold:#7C6E24; --gold-soft:#B9A845; --alert:#8C2334; --bar:#F4F4EE;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ground:#111309; --panel:#1B1E14; --sunk:#252921;
    --ink:#E8E8D9; --ink-2:#B3B6A2; --ink-3:#888D76;
    --rule:#333827; --gold:#CFB755; --gold-soft:#8E7F2E; --alert:#E08C99; --bar:#1B1E14;
  }}
  :root[data-theme="dark"]{
    --ground:#111309; --panel:#1B1E14; --sunk:#252921;
    --ink:#E8E8D9; --ink-2:#B3B6A2; --ink-3:#888D76;
    --rule:#333827; --gold:#CFB755; --gold-soft:#8E7F2E; --alert:#E08C99; --bar:#1B1E14;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{height:100%}
  body{
    margin:0; min-height:100vh; height:100dvh;
    background:var(--ground); color:var(--ink);
    font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-text-size-adjust:100%; overscroll-behavior:none;
  }

  header{
    background:var(--bar); border-bottom:1px solid var(--rule);
    padding:9px 12px calc(9px + env(safe-area-inset-top,0px));
    display:flex; flex-wrap:wrap; gap:9px 14px; align-items:center; flex:none;
  }
  .brand{display:flex;flex-direction:column;gap:1px}
  .brand b{font-size:16px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
  .brand span{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  }
  .layouts{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 320px}
  .lay{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px;letter-spacing:.03em;padding:9px 11px;border-radius:2px;
    cursor:pointer;white-space:nowrap;
    border:1px solid var(--rule); background:var(--panel); color:var(--ink-2);
    -webkit-tap-highlight-color:transparent;
  }
  .lay:hover{border-color:var(--gold-soft);color:var(--ink)}
  .lay[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--panel);font-weight:600}
  .lay:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  main{flex:1 1 auto;position:relative;min-height:300px}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}

  .note{
    position:absolute;left:10px;top:10px;max-width:300px;
    background:var(--panel);border:1px solid var(--rule);border-left:2px solid var(--gold);
    border-radius:0 2px 2px 0;padding:9px 11px;pointer-events:none;
  }
  .note h2{margin:0 0 3px;font-size:13px;font-weight:700;letter-spacing:-.01em}
  .note p{margin:0;font-size:12px;line-height:1.45;color:var(--ink-2)}

  .warn{
    position:absolute;left:10px;bottom:10px;
    background:var(--panel);border:1px solid var(--alert);border-radius:2px;
    padding:7px 10px;display:flex;align-items:center;gap:7px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--alert);
    max-width:calc(100% - 20px);
  }
  .warn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--alert);flex:none}

  .hud{
    position:absolute;right:10px;top:10px;
    background:var(--panel);border:1px solid var(--rule);border-radius:2px;
    padding:9px 11px;min-width:168px;
  }
  .hud .lab{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px;
  }
  .hud .name{margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:-.01em}
  .hud .dim{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px;color:var(--ink-2);margin:0;line-height:1.5;
  }
  .hud .acts{display:flex;gap:5px;margin-top:8px}
  .hud button{
    flex:1;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
    padding:9px 4px;border:1px solid var(--rule);background:var(--sunk);color:var(--ink-2);
    border-radius:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .hud button:hover{border-color:var(--gold-soft);color:var(--ink)}
  .hud button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

  footer{
    background:var(--bar);border-top:1px solid var(--rule);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
    display:flex;flex-wrap:wrap;gap:7px 16px;align-items:center;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;color:var(--ink-3);flex:none;
  }
  footer .grp{display:flex;align-items:center;gap:6px}
  footer kbd{
    background:var(--sunk);border:1px solid var(--rule);border-radius:2px;
    padding:2px 5px;font-family:inherit;font-size:10px;color:var(--ink-2);
  }
  .swatch{width:9px;height:9px;border-radius:1px;flex:none;display:inline-block}
  footer .sep{flex:1}
  .toggle{
    font-family:inherit;font-size:10.5px;padding:8px 10px;border-radius:2px;cursor:pointer;
    border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);
    -webkit-tap-highlight-color:transparent;
  }
  .toggle[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--panel)}

  @media (max-width:720px){
    .brand span{display:none}
    .layouts{flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
      -webkit-overflow-scrolling:touch;padding-bottom:2px}
    .layouts::-webkit-scrollbar{display:none}
    .note{left:10px;right:10px;top:auto;bottom:10px;max-width:none;pointer-events:auto;cursor:pointer}
    .note p{display:none}
    .note.open p{display:block;margin-top:4px}
    .hud{right:10px;top:10px;min-width:0;max-width:calc(100% - 20px)}
    .warn{left:10px;top:10px;bottom:auto;right:auto;max-width:calc(100% - 20px);font-size:10px}
    .hud:not([hidden]) ~ .warn{top:auto;bottom:74px}
    footer .grp.keys{display:none}
    footer{font-size:10px;gap:6px 10px;justify-content:space-between}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <b>Room 202</b>
    <span>132&Prime; back wall &middot; 108&Prime; main width &middot; 176&Prime; deep &middot; 24&times;32&Prime; alcove</span>
  </div>
  <div class="layouts" id="layouts"></div>
</header>

<main>
  <canvas id="c"></canvas>
  <div class="note" id="note"><h2 id="noteTitle">As photographed</h2><p id="noteBody"></p></div>
  <div class="hud" id="hud" hidden>
    <p class="lab">Selected</p>
    <p class="name" id="selName">&mdash;</p>
    <p class="dim" id="selDim"></p>
    <div class="acts">
      <button type="button" id="rotBtn">Rotate 90&deg;</button>
      <button type="button" id="clearBtn">Done</button>
    </div>
  </div>
  <div class="warn" id="warn" hidden><span id="warnText"></span></div>
</main>

<footer>
  <span class="grp keys"><kbd>drag item</kbd> move</span>
  <span class="grp keys"><kbd>drag floor</kbd> orbit</span>
  <span class="grp keys"><kbd>two-finger</kbd> pan</span>
  <span class="grp keys"><kbd>R</kbd> rotate</span>
  <span class="sep"></span>
  <span class="grp"><i class="swatch" style="background:#8C2334"></i> clash</span>
  <span class="grp"><i class="swatch" style="background:#C9A227"></i> door swing</span>
  <button class="toggle" type="button" id="topBtn" aria-pressed="false">Top view</button>
  <button class="toggle" type="button" id="wallBtn" aria-pressed="true">Walls</button>
</footer>

<script>
(function(){
  "use strict";
  var mainEl = document.querySelector("main");
  if(typeof THREE === "undefined"){
    mainEl.innerHTML = '<div style="padding:28px;max-width:44ch;font-size:14px;line-height:1.5">' +
      '<b>The 3D library did not load.</b><br>Reload once; if it still fails, the network is blocking cdnjs.</div>';
    return;
  }

  /* ============ Room 202, in inches ============
     x : 0 at the LEFT wall   → 134 at the right wall
     z : 0 at the WINDOW wall → 176 at the entry wall
     Left/right as seen standing in the room facing the window.

     Depth checks out against the measured chain:
        14 pier + 37 bed + 18 nightstand + 80 bed + 27 gap = 176           */
  var WM = 108, WW = 132, D = 176, H = 96;   // main width, wide width at the window, depth
  var CX = WW/2;
  var ALC = {x0:108, z0:0, x1:132, z1:32};   // right wall steps 24" out for the first 32"

  var PIER = {x0:26, z0:0, x1:56, z1:14};            // measured: 30w x 14d, 26" off the left wall
  var WIN_X0 = 80, WIN_X1 = 110, WIN_SILL = 12, WIN_HEAD = 89;   // 30" x 6'5"
  var WIN_CLR = {x0:80, z0:0, x1:110, z1:30};
  var BUILTIN = {x0:0, z0:172, x1:76, z1:176};       // brown closet, full wall up to the hallway
  var BUILTIN_CLR = {x0:0, z0:149, x1:76, z1:176};   // its doors need this
  var DOOR = {x0:76, z0:162, x1:108, z1:176};
  var HALL = {x0:76, z0:176, x1:108, z1:250};
  var SWING = 24;

  var SIZE = {
    bed:{x:37,z:80,h:68}, wardrobe:{x:40,z:24,h:93}, nightstand:{x:18,z:18,h:24},
    desk:{x:40,z:20,h:30}, chair:{x:15,z:15,h:16}
  };

  var ITEMS = [
    {id:"bed1", kind:"bed", label:"Bunk bed · back wall"},
    {id:"bed2", kind:"bed", label:"Bunk bed · left wall"},
    {id:"night1", kind:"nightstand", label:"Nightstand"},
    {id:"night2", kind:"nightstand", label:"Nightstand"},
    {id:"closet1", kind:"wardrobe", label:"Grey closet · 2 doors"},
    {id:"closet2", kind:"wardrobe", label:"Grey closet · 2 doors"},
    {id:"desk", kind:"desk", label:"Desk (added)"},
    {id:"chair", kind:"chair", label:"Folding stool"}
  ];

  var LAYOUTS = [
    {name:"As photographed", hide:["desk"],
     blurb:"The room as it stands. Bed along the back wall, held 14\u2033 off it by the pier; nightstand; second bed down the left wall; then the 27\u2033 gap to the built-in closet. Both grey closets and the second nightstand on the right. No desk \u2014 there isn't one yet.",
     pos:{bed1:[40,32.5,90], night1:[9,60,0], bed2:[18.5,109,0],
          closet1:[96,74,270], closet2:[96,114,270], night2:[93,145,0], chair:[49.5,95.5,0]}},
    {name:"1 \u00b7 Desk by the built-in",
     blurb:"Nothing moves except the second nightstand, which goes into the alcove by the window where it costs no floor. The desk drops into the 23\u2033 strip between the left-wall bed and the closet doors, running down to the built-in's clearance line \u2014 the only place in the room a desk actually fits.",
     pos:{bed1:[40,32.5,90], night1:[9,60,0], bed2:[18.5,109,0],
          closet1:[96,74,270], closet2:[96,114,270], night2:[119,17,0],
          desk:[48,128,90], chair:[65.5,141.5,0]}},
    {name:"2 \u00b7 Beds apart",
     blurb:"The left-wall bed crosses to the right wall and both grey closets take the left wall instead. Puts real distance between the two beds, and the desk still lands beside the built-in with more elbow room around it.",
     pos:{bed1:[40,32.5,90], bed2:[89.5,100,0], closet1:[12,80,90], closet2:[12,120,90],
          night1:[57,69,0], night2:[119,17,0], desk:[58,128,90], chair:[55.5,99.5,0]}}
  ];

  /* ============ textures ============ */
  function tex(w,h,draw,rx,ry){
    var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    draw(cv.getContext("2d"), w, h);
    var t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx || 1, ry || 1); t.anisotropy = 4;
    return t;
  }
  function noise(g,w,h,n,a){
    for(var i=0;i<n;i++){
      g.fillStyle = "rgba(0,0,0," + (Math.random()*a).toFixed(3) + ")";
      g.fillRect(Math.random()*w, Math.random()*h, 1.5, 1.5);
    }
  }
  var texFloor = tex(512,512,function(g,w,h){
    g.fillStyle="#C49A6B"; g.fillRect(0,0,w,h);
    var rows=6, rh=h/rows;
    for(var r=0;r<rows;r++){
      var t=186+Math.random()*26;
      g.fillStyle="rgb("+Math.round(t)+","+Math.round(t*0.78)+","+Math.round(t*0.55)+")";
      g.fillRect(0,r*rh,w,rh-1.5);
      for(var k=0;k<26;k++){
        g.strokeStyle="rgba(120,84,50,0.10)"; g.lineWidth=0.6+Math.random();
        var y=r*rh+Math.random()*rh; g.beginPath(); g.moveTo(0,y);
        g.bezierCurveTo(w*0.3,y+(Math.random()-0.5)*5,w*0.7,y+(Math.random()-0.5)*5,w,y); g.stroke();
      }
      g.fillStyle="rgba(92,62,36,0.34)"; g.fillRect(0,r*rh+rh-1.5,w,1.5);
      g.fillRect(Math.floor(Math.random()*w),r*rh,1.5,rh);
    }
    noise(g,w,h,900,0.05);
  }, WM/48, D/48);

  var texGold = tex(512,512,function(g,w,h){
    var gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,"#A99A48"); gr.addColorStop(0.5,"#8E8239"); gr.addColorStop(1,"#7C7233");
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    for(var b=0;b<14;b++){
      var bx=Math.random()*w, by=Math.random()*h, ang=-Math.PI/2+(Math.random()-0.5);
      g.strokeStyle="rgba(226,222,196,0.30)"; g.lineWidth=1.4;
      var len=60+Math.random()*90;
      g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+Math.cos(ang)*len,by+Math.sin(ang)*len); g.stroke();
      for(var l=0;l<9;l++){
        var t=l/9, lx=bx+Math.cos(ang)*len*t, ly=by+Math.sin(ang)*len*t, side=l%2?1:-1;
        g.fillStyle="rgba(232,229,205,0.26)";
        g.beginPath(); g.ellipse(lx+side*7,ly,7,3.4,ang+side*0.8,0,Math.PI*2); g.fill();
      }
    }
    for(var s=0;s<40;s++){ g.fillStyle="rgba(255,250,220,0.035)"; g.fillRect(0,Math.random()*h,w,2+Math.random()*9); }
    noise(g,w,h,700,0.06);
  }, D/64, H/64);

  var texPlaster = tex(256,256,function(g,w,h){
    g.fillStyle="#E7E3D7"; g.fillRect(0,0,w,h);
    for(var s=0;s<26;s++){ g.fillStyle="rgba(200,194,178,0.16)";
      g.fillRect(Math.random()*w,Math.random()*h,14+Math.random()*44,2+Math.random()*7); }
    noise(g,w,h,600,0.05);
  }, 3, 2);

  var texBeech = tex(256,512,function(g,w,h){
    g.fillStyle="#B4783A"; g.fillRect(0,0,w,h);
    for(var i=0;i<130;i++){
      g.strokeStyle="rgba(120,72,28,"+(0.05+Math.random()*0.14).toFixed(2)+")";
      g.lineWidth=0.7+Math.random()*1.8;
      var x=Math.random()*w; g.beginPath(); g.moveTo(x,0);
      g.bezierCurveTo(x+(Math.random()-0.5)*20,h*0.33,x+(Math.random()-0.5)*20,h*0.66,x+(Math.random()-0.5)*12,h);
      g.stroke();
    }
    noise(g,w,h,500,0.05);
  }, 1, 1);

  var texGrey = tex(256,256,function(g,w,h){
    g.fillStyle="#DAD6CB"; g.fillRect(0,0,w,h);
    for(var s=0;s<22;s++){ g.fillStyle="rgba(160,156,146,0.10)";
      g.fillRect(Math.random()*w,Math.random()*h,10+Math.random()*40,2+Math.random()*10); }
    noise(g,w,h,420,0.045);
  }, 1, 1);

  var texCloth = tex(128,128,function(g,w,h){
    g.fillStyle="#B7BBC2"; g.fillRect(0,0,w,h);
    for(var y=0;y<h;y+=3){ g.strokeStyle="rgba(255,255,255,0.10)"; g.lineWidth=1;
      g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
    for(var x=0;x<w;x+=3){ g.strokeStyle="rgba(90,96,106,0.07)"; g.lineWidth=1;
      g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
    noise(g,w,h,300,0.05);
  }, 2, 3);

  var texDark = tex(128,256,function(g,w,h){
    g.fillStyle="#4C3027"; g.fillRect(0,0,w,h);
    for(var i=0;i<70;i++){
      g.strokeStyle="rgba(28,16,12,"+(0.08+Math.random()*0.18).toFixed(2)+")";
      g.lineWidth=0.6+Math.random()*1.4;
      var x=Math.random()*w; g.beginPath(); g.moveTo(x,0); g.lineTo(x+(Math.random()-0.5)*10,h); g.stroke();
    }
  }, 1, 1);

  /* ============ scene ============ */
  var canvas = document.getElementById("c");
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 1, 4000);

  function themeDark(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t === "dark") return true;
    if(t === "light") return false;
    return matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function paintBg(){ scene.background = new THREE.Color(themeDark() ? 0x111309 : 0xE6E7DE); }
  paintBg();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintBg);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8f8f7c, 0.80));
  var sun = new THREE.DirectionalLight(0xfff2da, 0.62); sun.position.set(120,250,-180); scene.add(sun);
  var fill = new THREE.DirectionalLight(0xdde6ff, 0.26); fill.position.set(-180,140,220); scene.add(fill);

  var world = new THREE.Group(); world.position.set(-CX, 0, -D/2); scene.add(world);

  function mat(t, o){
    o = o || {};
    return new THREE.MeshLambertMaterial({
      map:t||null, color:o.color!==undefined?o.color:0xffffff,
      transparent:o.op!==undefined, opacity:o.op!==undefined?o.op:1,
      side:o.side||THREE.FrontSide, depthWrite:o.op===undefined
    });
  }
  function boxAt(x0,z0,x1,z1,y0,y1,m){
    var me = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0), m);
    me.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
    return me;
  }

  world.add(boxAt(0,0,WM,D,-1,0, mat(texFloor)));
  world.add(boxAt(ALC.x0,ALC.z0,ALC.x1,ALC.z1,-1,0, mat(texFloor)));     // the alcove floor
  world.add(boxAt(HALL.x0,HALL.z0,HALL.x1,HALL.z1,-1,0, mat(texFloor,{color:0xBFB4A2})));

  var walls = new THREE.Group(); world.add(walls);
  var T = 4, IN = {side:THREE.BackSide};
  var mGold = mat(texGold,IN), mPale = mat(texPlaster,IN), mPier = mat(texPlaster);

  walls.add(boxAt(-T,0,0,D,0,H,mGold));                        // left wall, gold paper
  walls.add(boxAt(0,-T,WIN_X0,0,0,H,mPale));                   // back wall, left of the window
  walls.add(boxAt(WIN_X1,-T,WW,0,0,H,mPale));                  // back wall, right of the window
  walls.add(boxAt(WIN_X0,-T,WIN_X1,0,0,WIN_SILL,mPale));       // under the window
  walls.add(boxAt(WIN_X0,-T,WIN_X1,0,WIN_HEAD,H,mPale));       // over the window
  walls.add(boxAt(WW,0,WW+T,ALC.z1,0,H,mPale));                // far side of the alcove
  walls.add(boxAt(WM,ALC.z1,WW+T,ALC.z1+T,0,H,mPale));         // the step back in
  walls.add(boxAt(WM,ALC.z1,WM+T,HALL.z1,0,H,mPale));          // right wall, main run
  walls.add(boxAt(HALL.x0-T,D,HALL.x0,HALL.z1,0,H,mPale));     // hallway left wall
  walls.add(boxAt(HALL.x0,HALL.z1,WM,HALL.z1+T,0,H,mPale));    // hallway far end
  walls.add(boxAt(PIER.x0,PIER.z0,PIER.x1,PIER.z1,0,H,mPier)); // the pier

  var mBeech = mat(texBeech);
  walls.add(boxAt(BUILTIN.x0,BUILTIN.z0,BUILTIN.x1,BUILTIN.z1,0,H,mBeech));
  var seamMat = mat(null,{color:0x74491F});
  for(var dx = 19; dx < BUILTIN.x1; dx += 19){
    walls.add(boxAt(dx-0.5,BUILTIN.z0-0.6,dx+0.5,BUILTIN.z0,0,H,seamMat));
  }
  walls.add(boxAt(WIN_X0,-T+1.2,WIN_X1,-T+2.4,WIN_SILL,WIN_HEAD, mat(null,{color:0xA9C6D2,op:0.38})));

  /* ---- floor keep-clear markings ---- */
  var mClear = mat(null,{color:0xC9A227, op:0.16});
  world.add(boxAt(WIN_CLR.x0,WIN_CLR.z0,WIN_CLR.x1,WIN_CLR.z1,0.2,0.5,mClear));
  world.add(boxAt(BUILTIN_CLR.x0,BUILTIN_CLR.z0,BUILTIN_CLR.x1,BUILTIN_CLR.z1,0.2,0.5,mClear));
  world.add(boxAt(DOOR.x0,DOOR.z0,DOOR.x1,DOOR.z1,0.2,0.4, mat(null,{color:0x6E7360, op:0.14})));

  var grid = new THREE.GridHelper(Math.max(WW,D), Math.round(Math.max(WW,D)/12), 0x9aa08c, 0x9aa08c);
  grid.material.opacity = 0.14; grid.material.transparent = true;
  grid.position.set(CX, 0.05, D/2); world.add(grid);

  /* ============ furniture ============ */
  var mSteel = mat(null,{color:0x2A2B2E}), mClothM = mat(texCloth), mGreyM = mat(texGrey),
      mDarkM = mat(texDark), mBeechM = mat(texBeech), mLine = mat(null,{color:0x9C998E}),
      mBlue = mat(null,{color:0x2E7FC2}), mSeat = mat(null,{color:0x9AA0A6}),
      mFoot = mat(null,{color:0x1C1C1E});

  function buildBed(){                       // bunk: two tiers on a black steel frame
    var g = new THREE.Group(), s = SIZE.bed, p = 2.2;
    [[0,0],[s.x-p,0],[0,s.z-p],[s.x-p,s.z-p]].forEach(function(c){
      g.add(boxAt(c[0],c[1],c[0]+p,c[1]+p,0,s.h,mSteel));
    });
    g.add(boxAt(1,1,s.x-1,s.z-1,11,14,mSteel));
    g.add(boxAt(1.5,1.5,s.x-1.5,s.z-1.5,14,21,mClothM));
    g.add(boxAt(1,1,s.x-1,s.z-1,52,55,mSteel));
    g.add(boxAt(1.5,1.5,s.x-1.5,s.z-1.5,55,62,mClothM));
    g.add(boxAt(0,0,p,s.z,62,s.h,mSteel));
    g.add(boxAt(s.x-p,0,s.x,s.z,62,s.h,mSteel));
    return g;
  }
  function buildWardrobe(){
    var g = new THREE.Group(), s = SIZE.wardrobe;
    g.add(boxAt(0,0,s.x,s.z,0,s.h,mGreyM));
    g.add(boxAt(s.x/2-0.4,-0.5,s.x/2+0.4,0.4,26,s.h,mLine));
    g.add(boxAt(0,-0.5,s.x,0.4,25.2,26,mLine));
    g.add(boxAt(s.x*0.25-3,-1.1,s.x*0.25+3,-0.2,54,55.2,mLine));
    g.add(boxAt(s.x*0.75-3,-1.1,s.x*0.75+3,-0.2,54,55.2,mLine));
    return g;
  }
  function buildNightstand(){
    var g = new THREE.Group(), s = SIZE.nightstand;
    g.add(boxAt(0,0,s.x,s.z,0,s.h,mDarkM));
    [7,15].forEach(function(y){ g.add(boxAt(2,-0.6,s.x-2,0.3,y,y+0.7,mLine)); });
    return g;
  }
  function buildDesk(){
    var g = new THREE.Group(), s = SIZE.desk;
    g.add(boxAt(0,0,s.x,s.z,s.h-1.6,s.h,mBeechM));
    g.add(boxAt(0.8,0.8,3.4,s.z-0.8,0,s.h-1.6,mBeechM));
    g.add(boxAt(s.x-3.4,0.8,s.x-0.8,s.z-0.8,0,s.h-1.6,mBeechM));
    g.add(boxAt(3.4,s.z-2.4,s.x-3.4,s.z-0.8,8,s.h-1.6,mBeechM));
    g.add(boxAt(s.x-20,1.2,s.x-4,s.z-3,18,s.h-2.2,mBeechM));
    g.add(boxAt(s.x-18,0.4,s.x-6,1.4,22.5,23.5,mLine));
    return g;
  }
  function buildChair(){                     // folding tripod stool: grey seat, blue legs
    var g = new THREE.Group(), s = SIZE.chair, seatY = s.h - 1.4, hub = 5.5;
    var legs = [[s.x*0.5, 0], [0, s.z], [s.x, s.z]];
    legs.forEach(function(p){
      var dx = p[0] - s.x/2, dz = p[1] - s.z/2;
      var len = Math.sqrt(dx*dx + dz*dz + seatY*seatY);
      var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, len, 8), mBlue);
      leg.position.set(s.x/2 + dx/2, (seatY + hub)/2 - 1, s.z/2 + dz/2);
      leg.lookAt(new THREE.Vector3(p[0], 0, p[1]));
      leg.rotateX(Math.PI/2);
      g.add(leg);
      var foot = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 2.2, 8), mFoot);
      foot.position.set(p[0], 1.1, p[1]);
      g.add(foot);
    });
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,2.4,8), mFoot)
           .translateX(s.x/2).translateY(hub).translateZ(s.z/2));
    var seat = new THREE.Mesh(new THREE.CylinderGeometry(s.x*0.56, s.x*0.5, 1.3, 3), mSeat);
    seat.position.set(s.x/2, seatY, s.z/2);
    seat.rotation.y = Math.PI;
    g.add(seat);
    return g;
  }
  var BUILD = {bed:buildBed, wardrobe:buildWardrobe, nightstand:buildNightstand,
               desk:buildDesk, chair:buildChair};

  var picks = [];
  ITEMS.forEach(function(it){
    var pivot = new THREE.Group(), inner = BUILD[it.kind]();
    inner.position.set(-SIZE[it.kind].x/2, 0, -SIZE[it.kind].z/2);
    pivot.add(inner);
    if(it.kind === "wardrobe"){                 // door-swing patch rides with the closet
      var s = SIZE[it.kind];
      var patch = boxAt(-s.x/2, -s.z/2 - SWING, s.x/2, -s.z/2, 0.25, 0.55, mClear);
      pivot.add(patch);
    }
    world.add(pivot);
    it.node = pivot; it.rot = 0; it.cx = 0; it.cz = 0; it.baseMats = [];
    inner.traverse(function(o){
      if(o.isMesh){ it.baseMats.push([o, o.material]); picks.push(o); o.userData.owner = it; }
    });
  });

  var matClash = mat(null,{color:0x8C2334}), matSel = mat(null,{color:0xC9A227});

  function footprint(it, cx, cz, rot){
    var s = SIZE[it.kind], sx = s.x, sz = s.z;
    if(rot === 90 || rot === 270){ sx = s.z; sz = s.x; }
    return {x0:cx-sx/2, z0:cz-sz/2, x1:cx+sx/2, z1:cz+sz/2};
  }
  function swingOf(it){                        // keep-clear rect in front of a closet's doors
    var f = footprint(it, it.cx, it.cz, it.rot), r = it.rot;
    if(r === 0)   return {x0:f.x0, z0:f.z0-SWING, x1:f.x1, z1:f.z0};
    if(r === 180) return {x0:f.x0, z0:f.z1, x1:f.x1, z1:f.z1+SWING};
    if(r === 90)  return {x0:f.x1, z0:f.z0, x1:f.x1+SWING, z1:f.z1};
    return {x0:f.x0-SWING, z0:f.z0, x1:f.x0, z1:f.z1};
  }
  function place(it, cx, cz, rot){
    it.cx = cx; it.cz = cz; it.rot = rot;
    it.node.position.set(cx, 0, cz);
    it.node.rotation.y = -rot * Math.PI/180;
  }
  function ov(a,b){
    return Math.min(a.x1,b.x1) - Math.max(a.x0,b.x0) > 0.5 &&
           Math.min(a.z1,b.z1) - Math.max(a.z0,b.z0) > 0.5;
  }
  function inBounds(f){
    if(f.x0 < -0.5 || f.z0 < -0.5 || f.z1 > D+0.5) return false;
    if(f.x1 <= WM+0.5) return true;
    return f.z1 <= ALC.z1+0.5 && f.x1 <= WW+0.5;   // may reach right only inside the alcove
  }
  function clamp(it, cx, cz, rot){
    var s = SIZE[it.kind], sx = s.x, sz = s.z;
    if(rot === 90 || rot === 270){ sx = s.z; sz = s.x; }
    cz = Math.max(sz/2, Math.min(D - sz/2, cz));
    var maxX = (cz + sz/2 <= ALC.z1 + 0.5) ? WW - sx/2 : WM - sx/2;
    return [Math.max(sx/2, Math.min(maxX, cx)), cz];
  }

  var selected = null;
  function evaluate(){
    var live = ITEMS.filter(function(it){ return !it.hidden; });
    var fps = live.map(function(it){ return {it:it, f:footprint(it,it.cx,it.cz,it.rot)}; });
    var bad = {}, msgs = {};
    fps.forEach(function(a){
      if(!inBounds(a.f)) bad[a.it.id] = true;
      if(ov(a.f, PIER)){ bad[a.it.id] = true; msgs["Runs into the wall pier"] = 1; }
      if(ov(a.f, WIN_CLR)){ bad[a.it.id] = true; msgs["Window can't open"] = 1; }
      if(ov(a.f, DOOR)){ bad[a.it.id] = true; msgs["Doorway blocked"] = 1; }
      if(ov(a.f, BUILTIN_CLR)){ bad[a.it.id] = true; msgs["Blocking the built-in closet"] = 1; }
    });
    live.forEach(function(w){                   // nothing may sit in a grey closet's door swing
      if(w.kind !== "wardrobe") return;
      var sw = swingOf(w);
      fps.forEach(function(a){
        if(a.it === w) return;
        if(ov(a.f, sw)){ bad[a.it.id] = true; msgs["Blocking a grey closet"] = 1; }
      });
    });
    for(var i=0;i<fps.length;i++) for(var j=i+1;j<fps.length;j++)
      if(ov(fps[i].f, fps[j].f)){ bad[fps[i].it.id] = true; bad[fps[j].it.id] = true; }

    live.forEach(function(it){
      var tint = bad[it.id] ? matClash : (selected === it ? matSel : null);
      it.baseMats.forEach(function(pr){ pr[0].material = tint || pr[1]; });
    });

    var list = Object.keys(msgs);
    var n = Object.keys(bad).length;
    if(!list.length && n) list.push(n + (n===1 ? " item clashes" : " items clash"));
    var warn = document.getElementById("warn");
    if(list.length){ document.getElementById("warnText").textContent = list.join(" · "); warn.hidden = false; }
    else warn.hidden = true;
  }

  function showHud(){
    var hud = document.getElementById("hud");
    if(!selected){ hud.hidden = true; return; }
    hud.hidden = false;
    var s = SIZE[selected.kind], f = footprint(selected, selected.cx, selected.cz, selected.rot);
    document.getElementById("selName").textContent = selected.label;
    document.getElementById("selDim").innerHTML =
      s.x + "″ × " + s.z + "″ × " + s.h + "″ h<br>" +
      "at " + Math.round(f.x0) + "″, " + Math.round(f.z0) + "″ · " + selected.rot + "°";
  }

  /* ============ layouts ============ */
  var anim = null;
  function applyLayout(idx, instant){
    var L = LAYOUTS[idx];
    document.getElementById("noteTitle").textContent = L.name;
    document.getElementById("noteBody").textContent = L.blurb;
    Array.prototype.forEach.call(document.querySelectorAll(".lay"), function(b,i){
      b.setAttribute("aria-pressed", i === idx ? "true" : "false");
    });
    ITEMS.forEach(function(it){
      it.hidden = !!(L.hide && L.hide.indexOf(it.id) >= 0);
      it.node.visible = !it.hidden;
    });
    if(selected && selected.hidden) selected = null;
    var from = ITEMS.map(function(it){ return [it.cx, it.cz, it.rot]; });
    var to = ITEMS.map(function(it){ var p = L.pos[it.id]; return p ? [p[0],p[1],p[2]] : [it.cx,it.cz,it.rot]; });
    if(instant || matchMedia("(prefers-reduced-motion: reduce)").matches){
      ITEMS.forEach(function(it,i){ place(it,to[i][0],to[i][1],to[i][2]); });
      evaluate(); showHud(); return;
    }
    var t0 = performance.now(), dur = 620;
    if(anim) cancelAnimationFrame(anim);
    (function step(now){
      var t = Math.min(1,(now-t0)/dur), e = t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
      ITEMS.forEach(function(it,i){
        var a = from[i], b = to[i], dr = ((b[2]-a[2]+540)%360)-180;
        place(it, a[0]+(b[0]-a[0])*e, a[1]+(b[1]-a[1])*e, a[2]+dr*e);
      });
      if(t<1) anim = requestAnimationFrame(step);
      else { ITEMS.forEach(function(it,i){ place(it,to[i][0],to[i][1],to[i][2]); }); evaluate(); showHud(); }
    })(t0);
  }

  var layoutsEl = document.getElementById("layouts");
  LAYOUTS.forEach(function(L,i){
    var b = document.createElement("button");
    b.className = "lay"; b.type = "button"; b.textContent = L.name;
    b.setAttribute("aria-pressed","false");
    b.addEventListener("click", function(){ applyLayout(i); });
    layoutsEl.appendChild(b);
  });
  document.getElementById("note").addEventListener("click", function(){ this.classList.toggle("open"); });

  /* ============ camera ============ */
  var target = new THREE.Vector3(0,24,0);
  var sph = {r:408, phi:0.80, theta:-0.52};
  function updateCam(){
    sph.phi = Math.max(0.12, Math.min(Math.PI/2-0.02, sph.phi));
    sph.r = Math.max(70, Math.min(1000, sph.r));
    camera.position.set(
      target.x + sph.r*Math.sin(sph.phi)*Math.sin(sph.theta),
      target.y + sph.r*Math.cos(sph.phi),
      target.z + sph.r*Math.sin(sph.phi)*Math.cos(sph.theta));
    camera.lookAt(target);
  }

  /* ============ input ============ */
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  var plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
  var mode = null, last = {x:0,y:0}, grab = null, pinch = 0, moved = false, touches = 0;

  function toNdc(px,py){
    var r = canvas.getBoundingClientRect();
    ndc.x = ((px-r.left)/r.width)*2-1; ndc.y = -((py-r.top)/r.height)*2+1;
  }
  function floorHit(px,py){
    toNdc(px,py); ray.setFromCamera(ndc,camera);
    var p = new THREE.Vector3();
    if(!ray.ray.intersectPlane(plane,p)) return null;
    return {x:p.x + CX, z:p.z + D/2};
  }
  function itemHit(px,py){
    toNdc(px,py); ray.setFromCamera(ndc,camera);
    var hits = ray.intersectObjects(picks.filter(function(m){ return !m.userData.owner.hidden; }), false);
    return hits.length ? hits[0].object.userData.owner : null;
  }
  function panBy(dx,dy){
    var k = sph.r*0.0016;
    target.addScaledVector(new THREE.Vector3(Math.cos(sph.theta),0,-Math.sin(sph.theta)), -dx*k);
    target.addScaledVector(new THREE.Vector3(Math.sin(sph.theta),0, Math.cos(sph.theta)), -dy*k);
    updateCam();
  }

  canvas.addEventListener("pointerdown", function(e){
    if(e.pointerType === "touch"){ touches++; if(touches > 1){ mode = "pan"; grab = null; return; } }
    canvas.setPointerCapture(e.pointerId);
    last.x = e.clientX; last.y = e.clientY; moved = false;
    if(e.button === 2 || e.button === 1 || e.shiftKey){ mode = "pan"; return; }
    var it = itemHit(e.clientX, e.clientY);
    if(it){
      var f = floorHit(e.clientX, e.clientY);
      selected = it; showHud(); evaluate(); mode = "item";
      grab = {it:it, dx: f ? f.x - it.cx : 0, dz: f ? f.z - it.cz : 0};
      canvas.classList.add("dragging");
    } else mode = "orbit";
  });
  canvas.addEventListener("pointermove", function(e){
    if(!mode || touches > 1) return;
    var dx = e.clientX-last.x, dy = e.clientY-last.y;
    if(Math.abs(dx)+Math.abs(dy) > 2) moved = true;
    last.x = e.clientX; last.y = e.clientY;
    if(mode === "orbit"){ sph.theta -= dx*0.006; sph.phi -= dy*0.006; updateCam(); }
    else if(mode === "pan") panBy(dx,dy);
    else if(mode === "item" && grab){
      var f = floorHit(e.clientX, e.clientY);
      if(f){
        var c = clamp(grab.it, Math.round(f.x-grab.dx), Math.round(f.z-grab.dz), grab.it.rot);
        place(grab.it, c[0], c[1], grab.it.rot);
        evaluate(); showHud();
      }
    }
  });
  function endPtr(e){
    if(e.pointerType === "touch") touches = Math.max(0, touches-1);
    if(mode === "orbit" && !moved){ selected = null; showHud(); evaluate(); }
    mode = null; grab = null; canvas.classList.remove("dragging");
    try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  }
  canvas.addEventListener("pointerup", endPtr);
  canvas.addEventListener("pointercancel", endPtr);
  canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  canvas.addEventListener("wheel", function(e){
    e.preventDefault(); sph.r *= (1 + Math.sign(e.deltaY)*0.09); updateCam();
  }, {passive:false});

  canvas.addEventListener("touchstart", function(e){
    if(e.touches.length === 2){
      mode = "pan"; grab = null; canvas.classList.remove("dragging");
      pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      last.x = (e.touches[0].clientX+e.touches[1].clientX)/2;
      last.y = (e.touches[0].clientY+e.touches[1].clientY)/2;
    }
  }, {passive:true});
  canvas.addEventListener("touchmove", function(e){
    if(e.touches.length === 2){
      e.preventDefault();
      var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if(pinch) sph.r *= pinch/d;
      pinch = d;
      var mx = (e.touches[0].clientX+e.touches[1].clientX)/2, my = (e.touches[0].clientY+e.touches[1].clientY)/2;
      panBy(mx-last.x, my-last.y); last.x = mx; last.y = my;
    }
  }, {passive:false});
  canvas.addEventListener("touchend", function(e){ if(e.touches.length < 2) pinch = 0; }, {passive:true});

  function rotateSel(){
    if(!selected) return;
    var r = (selected.rot + 90) % 360;
    var c = clamp(selected, selected.cx, selected.cz, r);
    place(selected, c[0], c[1], r); evaluate(); showHud();
  }
  document.getElementById("rotBtn").addEventListener("click", rotateSel);
  document.getElementById("clearBtn").addEventListener("click", function(){
    selected = null; showHud(); evaluate();
  });
  addEventListener("keydown", function(e){
    if(e.key === "r" || e.key === "R") rotateSel();
    if(e.key === "Escape"){ selected = null; showHud(); evaluate(); }
    var n = parseInt(e.key,10);
    if(n >= 1 && n <= LAYOUTS.length) applyLayout(n-1);
  });

  var topBtn = document.getElementById("topBtn"), wallBtn = document.getElementById("wallBtn");
  topBtn.addEventListener("click", function(){
    var on = topBtn.getAttribute("aria-pressed") !== "true";
    topBtn.setAttribute("aria-pressed", on ? "true" : "false");
    sph.phi = on ? 0.13 : 0.80; sph.theta = on ? 0 : -0.52;
    sph.r = on ? (innerWidth < 620 ? 360 : 344) : (innerWidth < 620 ? 430 : 408);
    target.set(0, on ? 0 : 24, 0); updateCam();
  });
  wallBtn.addEventListener("click", function(){
    var on = wallBtn.getAttribute("aria-pressed") !== "true";
    wallBtn.setAttribute("aria-pressed", on ? "true" : "false");
    walls.visible = on;
  });

  function resize(){
    var r = canvas.getBoundingClientRect();
    if(!r.width || !r.height) return;
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width/r.height;
    if(!resize.tuned){ sph.r = r.width < 620 ? 430 : 408; resize.tuned = true; updateCam(); }
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  addEventListener("orientationchange", function(){ setTimeout(resize, 200); });
  new ResizeObserver(resize).observe(mainEl);

  applyLayout(0, true);
  resize(); requestAnimationFrame(resize); setTimeout(resize, 250); updateCam();
  (function loop(){ renderer.render(scene, camera); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
